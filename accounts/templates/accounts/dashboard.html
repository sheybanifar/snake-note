{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Welcome {{ request.user.username }}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
</head>
<body>
    <nav class="navbar bg-danger-subtle d-flex flex-row">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Snake note</span>
            {% if request.user.is_authenticated %}
            <div>
                <span>{{ request.user.username }} /
                <form action="{% url 'accounts:logout' %}" method="post">
                    {% csrf_token %}
                    <input type="submit" value="log out">
                </form>
            </div>
            {% endif %}
        </div>
    </nav>
</body>
</html>
