{% extends 'index.html' %}

{% block title %}Set password{% endblock %}

{% block content %}
{% if validlink %}
<h2>Please set your password</h2>
<form action="" method="post">
    {{ form }}
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% else %}
<p>Perhaps the link was invalid. please request <a href="{% url 'accounts:password_reset' %}">again</a></p>
{% endif %}
{% endblock %}
